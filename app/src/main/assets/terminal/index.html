<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
html,body{margin:0;height:100%;background:#101211;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100%}
#term{flex:1;min-height:0;padding:4px 6px 0}
#keys{display:flex;gap:6px;padding:6px;background:#1b1e1c;border-top:1px solid #2e332f;overflow-x:auto;-webkit-overflow-scrolling:touch}
#keys button{flex:0 0 auto;min-width:44px;height:40px;padding:0 12px;border:1px solid #2e332f;border-radius:10px;background:#242825;color:#f2f4f1;font:600 15px monospace}
#keys button.on{background:#b9f589;color:#0d1a05}
#keys button:active{background:#3a403b}
</style></head><body><div id="wrap"><div id="term"></div><div id="keys"></div></div>
<script src="xterm.js"></script><script src="xterm-addon-fit.js"></script>
<script>
const term=new Terminal({fontFamily:'monospace',fontSize:13,cursorBlink:true,scrollback:5000,allowProposedApi:true,theme:{background:'#101211',foreground:'#f2f4f1',cursor:'#b9f589',selectionBackground:'#3a5a2a'}});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('term'));
let ctrl=false,alt=false;
const enc=new TextEncoder();
function send(s){Term.input(btoa(String.fromCharCode(...enc.encode(s))))}
function resize(){try{fit.fit();Term.resize(term.rows,term.cols)}catch(e){}}
window.addEventListener('resize',()=>setTimeout(resize,50));
term.onData(d=>{
  if(ctrl&&d.length===1){const c=d.toUpperCase().charCodeAt(0);if(c>=64&&c<=95)d=String.fromCharCode(c-64);ctrl=false;mark()}
  if(alt){d='\x1b'+d;alt=false;mark()}
  send(d)});
// Native -> JS: raw bytes in base64.
window.feed=function(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);term.write(u)};
window.exited=function(code){term.write('\r\n\x1b[33m[процесс завершён, код '+code+']\x1b[0m\r\n')};
const defs=[['Esc','\x1b'],['Tab','\t'],['Ctrl','ctrl'],['Alt','alt'],['↑','\x1b[A'],['↓','\x1b[B'],['←','\x1b[D'],['→','\x1b[C'],['Home','\x1b[H'],['End','\x1b[F'],['PgUp','\x1b[5~'],['PgDn','\x1b[6~'],['/','/'],['-','-'],['|','|'],['~','~'],['Ctrl+C','\x03'],['Ctrl+D','\x04']];
const bar=document.getElementById('keys');const btn={};
function mark(){btn.Ctrl.classList.toggle('on',ctrl);btn.Alt.classList.toggle('on',alt)}
defs.forEach(([label,val])=>{const b=document.createElement('button');b.textContent=label;btn[label]=b;
  b.addEventListener('pointerdown',e=>{e.preventDefault();
    if(val==='ctrl'){ctrl=!ctrl;mark()}else if(val==='alt'){alt=!alt;mark()}else send(val);term.focus()});
  bar.appendChild(b)});
setTimeout(()=>{resize();term.focus();Term.ready(term.rows,term.cols)},100);
</script></body></html>
